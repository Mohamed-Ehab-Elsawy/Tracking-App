name: tracking_app
description: "A new Flutter Tracking project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  easy_localization: ^3.0.8
  awesome_dialog: ^3.3.0
  retrofit: ^4.9.1
  json_annotation: ^4.9.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  injectable: ^2.7.1+2
  get_it: ^9.2.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  envied: ^1.3.2
  pretty_dio_logger: ^1.4.0
  dio: ^5.9.0
  flutter_native_splash: ^2.4.7
  bloc_test: ^10.0.0
  loading_indicator: ^3.1.1
  pinput: ^6.0.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  skeletonizer: ^2.1.2
  lottie: ^3.3.2
  package_info_plus: ^9.0.0
  image_picker: ^1.0.7
  badges: ^3.1.2
  location: ^8.0.1
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  retrofit_generator: ^10.0.1
  injectable_generator:
  build_runner: ^2.7.1
  json_serializable: ^6.10.0
  mockito: ^5.5.0
  flutter_lints: ^5.0.0
  envied_generator: ^1.3.1
  flutter_launcher_icons: ^0.14.4

flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"

  adaptive_icon_background: "#F9ECF0"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/translations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_SemiBold.ttf
          weight: 600



dependency_overrides:
  rive_native: null